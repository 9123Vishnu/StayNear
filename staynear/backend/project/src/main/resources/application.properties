spring.application.name=staynear

# Render provides PORT; local Docker defaults to 8080.
server.port=${PORT:8080}

# Keep credentials outside source control. Local Docker supplies these values via Compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/staynear?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# For a new/test deployment, update is convenient. For production, use Flyway/Liquibase
# and set this to validate after reviewing the schema and migrations.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Set this to the exact deployed frontend origin in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
